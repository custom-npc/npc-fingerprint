[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npc-fingerprint"
version = "0.1.0"
description = "Defensive web technology fingerprinting and security-posture analyzer. Every detection carries evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
keywords = ["fingerprinting", "reconnaissance", "defensive-security", "wappalyzer", "tls", "http-headers"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "playwright>=1.49",     # JS-aware rendering (Chromium)
  "niquests>=3.10",       # --no-browser fetching, HTTP/2 + HTTP/3 visibility
  "regex>=2024.5",        # per-match timeouts for community regexes
  "mmh3>=5.0",            # Shodan-compatible favicon hashes
  "cryptography>=42",     # certificate parsing
  "rich>=13.7",           # terminal rendering primitives
  "dnspython>=2.6",       # CNAME/NS/MX/TXT lookups (resolver only, never the target)
  "pyyaml>=6.0",          # `db update` parses the nuclei / OWASP favicon YAML
]

[project.optional-dependencies]
psl = ["publicsuffixlist>=1.0"]   # exact registrable-domain logic (built-in table is an approximation)

[project.scripts]
npc-fingerprint = "npc_fingerprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
npc_fingerprint = ["data/*"]
