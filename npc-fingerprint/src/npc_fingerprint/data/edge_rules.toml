# Edge / CDN / WAF / proxy signatures. Used to separate "what the edge says" from "what the origin leaks".
# headers: present-name matches; header_values: "name:regex"; cookies: lower-case names (prefix match with *);
# cname / ns: DNS name suffixes.

[[edge]]
id = "cloudflare"
name = "Cloudflare"
kind = "cdn/waf"
headers = ["cf-ray", "cf-cache-status", "cf-mitigated"]
header_values = ["server:^cloudflare$"]
cookies = ["__cf_bm", "cf_clearance", "__cfruid"]
cname = ["cdn.cloudflare.net", "cloudflare.net"]
ns = ["ns.cloudflare.com"]

[[edge]]
id = "cloudfront"
name = "Amazon CloudFront"
kind = "cdn"
headers = ["x-amz-cf-id", "x-amz-cf-pop"]
header_values = ["via:cloudfront"]
cname = ["cloudfront.net"]

[[edge]]
id = "fastly"
name = "Fastly"
kind = "cdn"
headers = ["x-fastly-request-id", "fastly-debug-digest"]
header_values = ["x-served-by:^cache-"]
cname = ["fastly.net", "fastlylb.net"]

[[edge]]
id = "akamai"
name = "Akamai"
kind = "cdn/waf"
headers = ["x-akamai-transformed", "akamai-grn", "x-akamai-request-id"]
header_values = ["server:^akamai"]
cname = ["akamaiedge.net", "edgekey.net", "edgesuite.net", "akamai.net", "akamaized.net"]

[[edge]]
id = "azurefd"
name = "Azure Front Door / CDN"
kind = "cdn"
headers = ["x-azure-ref", "x-msedge-ref"]
cname = ["azurefd.net", "azureedge.net"]

[[edge]]
id = "gcp-lb"
name = "Google Cloud front end"
kind = "cdn/lb"
header_values = ["via:1\\.1 google", "server:^(gws|gse|esf|google frontend)$"]

[[edge]]
id = "vercel"
name = "Vercel Edge"
kind = "paas/cdn"
headers = ["x-vercel-id", "x-vercel-cache"]
header_values = ["server:^vercel$"]
cname = ["vercel-dns.com"]

[[edge]]
id = "netlify"
name = "Netlify Edge"
kind = "paas/cdn"
headers = ["x-nf-request-id"]
header_values = ["server:^netlify$"]
cname = ["netlify.app", "netlify.com"]

[[edge]]
id = "sucuri"
name = "Sucuri WAF"
kind = "waf"
headers = ["x-sucuri-id", "x-sucuri-cache"]
header_values = ["server:^sucuri"]

[[edge]]
id = "imperva"
name = "Imperva / Incapsula"
kind = "waf/cdn"
headers = ["x-iinfo"]
header_values = ["x-cdn:(imperva|incapsula)"]
cookies = ["incap_ses_*", "visid_incap_*"]

[[edge]]
id = "aws-elb"
name = "AWS Elastic Load Balancer"
kind = "load-balancer"
cookies = ["awsalb", "awsalbcors", "awselb"]

[[edge]]
id = "varnish"
name = "Varnish"
kind = "cache"
headers = ["x-varnish"]
header_values = ["via:varnish"]

# Generic evidence that *some* proxy/cache sits in front (used by the anomaly layer).
[proxy_evidence]
headers = ["via", "x-cache", "x-served-by", "x-cache-hits", "x-proxy-cache", "x-varnish", "x-forwarded-server"]

# Headers that describe the origin application; seeing them through an edge is an origin leak.
[origin_leaks]
headers = ["x-powered-by", "x-aspnet-version", "x-aspnetmvc-version", "x-generator", "x-drupal-cache", "x-runtime", "x-turbo-charged-by"]
